<div class="page-mask" *ngIf="isOpened" (click)="closeModal()"></div>

<div *ngIf="isOpened">
  <div class="select-account-category-container bottom-modal">
    <div class="row" *ngFor="let row of [].constructor(categoriesRows); let i = index;">
      <div class="category-item"
           *ngFor="let category of categoriesSelect.slice(i * 2, i * 2 + 2);"
           (click)="createAccountWithCategory(category)">
        <mat-icon svgIcon="{{category.iconName}}"></mat-icon>
        <div>{{ category.name }}</div>
      </div>
    </div>
  </div>
</div>
