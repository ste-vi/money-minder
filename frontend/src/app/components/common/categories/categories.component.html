
<div *ngIf="isOpened">
  <div class="categories-container bottom-modal">
    <div class="categories-container-header">
      <mat-icon svgIcon="close" class="gray-icon small-icon" (click)="closeModal()"></mat-icon>
      <div><b>Choose category</b></div>
      <div>
      </div>
    </div>
    <div class="categories-container-body">
      <div class="category" *ngFor="let category of categories">
        <div class="category-icon">
          <mat-icon svgIcon="{{category.icon}}"></mat-icon>
        </div>
        <div class="category-name">
          {{ category.name }}
        </div>
      </div>
      <div class="category">
        <div class="category-icon ">
          <mat-icon svgIcon="add"></mat-icon>
        </div>
        <div class="category-name active">
          Add
        </div>
      </div>
    </div>
  </div>
</div>
