databaseChangeLog:
  - include:
      file: classpath:/db/scripts/init.sql
  - changeSet:
      id: add_transaction_sync_date_column
      author: stef003
      changes:
        - addColumn:
            tableName: accounts
            columns:
              - column:
                  name: transaction_sync_date
                  type: timestamp
                  defaultValue: NULL
  - changeSet:
      id: drop_transactions_currency_check
      author: stef003
      changes:
        - sql:
            alter table transactions drop constraint transactions_currency_check;